<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Embedded systems, controls, and digital design projects by Giselle Mendoza">
  <title>Projects | Giselle Mendoza</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="newStyle.css">
  <script>document.documentElement.classList.add("js");</script>
  <noscript>
    <style>
      .masthead nav { display: block !important; position: static !important; }
      .menu-toggle { display: none !important; }
    </style>
  </noscript>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="index.html" aria-label="Giselle Mendoza, home">
      <img src="logo-navy.svg" alt="gm logo" width="150" height="150">
    </a>
    <button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">☰</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html" aria-current="page">Projects</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <div class="page-head">
      <p class="eyebrow">Feature 02</p>
      <h1>Things I've <em>built</em></h1>
      <p class="page-sub">Pick a topic to filter, then open a card to read the full story.</p>
    </div>

    <!-- Filter bar -->
    <div class="projects-filter" role="group" aria-label="Filter projects by topic">
      <button type="button" class="filter-button active" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter-button" data-filter="embedded" aria-pressed="false">Embedded</button>
      <button type="button" class="filter-button" data-filter="controls" aria-pressed="false">Controls</button>
      <button type="button" class="filter-button" data-filter="hardware" aria-pressed="false">Hardware</button>
    </div>

    <!-- projects.js fills this list with a card for each project -->
    <ul id="project-grid" class="project-grid"></ul>

    <noscript>
      <p class="page-sub">Please turn on JavaScript to see my projects.</p>
    </noscript>
  </main>

  <!-- Pop-up with the full details of one project (filled in by projects.js) -->
  <dialog id="project-modal" class="project-modal" aria-labelledby="modal-title">
    <div class="modal-header">
      <div>
        <p class="modal-sub" id="modal-sub"></p>
        <h2 id="modal-title"></h2>
      </div>
      <button type="button" class="modal-close" id="modal-close" aria-label="Close project details">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <div class="modal-links" id="modal-links"></div>
      <div class="modal-nav">
        <button type="button" id="modal-prev" aria-label="Previous project">&#8249;</button>
        <button type="button" id="modal-next" aria-label="Next project">&#8250;</button>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <p class="script">thanks for reading</p>
    <address class="social-icons">
      <a href="https://linkedin.com/in/giselle-mendoza" target="_blank" rel="noopener noreferrer">
        <img src="linkedin-light.svg" alt="LinkedIn" width="32" height="32">
      </a>
      <a href="mailto:g1mendoza@ucsd.edu">
        <img src="email-light.svg" alt="Email" width="32" height="32">
      </a>
      <a href="https://github.com/g1mendoza" target="_blank" rel="noopener noreferrer">
        <img src="github-light.svg" alt="GitHub" width="32" height="32">
      </a>
    </address>
    <p class="fine">&copy; 2026 Giselle Mendoza. All rights reserved.</p>
  </footer>

  <script src="jas.js"></script>
  <script src="projects.js"></script>
</body>
</html>
